name: Trigger auto deployment for mvcmusicstorecore

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ modern ]
    paths:
    - '**'
    - '.github/workflows/mvcmusicstorecore-AutoDeployTrigger-59985fe6-973c-4994-ad85-c2791b23a285.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.MVCMUSICSTORECORE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MVCMUSICSTORECORE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MVCMUSICSTORECORE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/MVC5
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: mvcmusicstoredemo.azurecr.io
          registryUsername: ${{ secrets.MVCMUSICSTORECORE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MVCMUSICSTORECORE_REGISTRY_PASSWORD }}
          containerAppName: mvcmusicstorecore
          resourceGroup: mvc-music-store
          imageToBuild: mvcmusicstoredemo.azurecr.io/mvcmusicstorecore:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


